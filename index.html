<!DOCTYPE html>
<html>
    <head>
        <title>Currency Converter</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" 
        rel="stylesheet">

        <link rel="stylesheet" href="./style.css">
    </head>
    <body>
        <div class="content-section">
            <h1 id="title">Currency Converter</h1>
            <form id="currency-converter-form">
                <div class="input-container">
                    <label class="input-label">Enter amount</label>
                    <input type="number" id="input-amount" placeholder="100" required/>
                </div>
                
                <div class="dropdown-container">
                    <div id="from-dropdown">
                        <div id="selected-from-option" data-value="INR">
                            <img src="https://flags.restcountries.com/v5/w640/in.png" class="flag-image">
                            <span class="currency-code">INR Indian rupee</span>
                            <span class="arrow">&#8744;</span>
                        </div>
                        <div id="from-options"></div>
                    </div>
                    <label>TO</label>
                    <div id="to-dropdown">
                        <div id="selected-to-option" data-value="USD">
                            <img src="https://flags.restcountries.com/v5/w640/us.png" class="flag-image">
                            <span class="currency-code">USD United States dollar</span>
                            <span class="arrow">&#8744;</span>
                        </div>
                        <div id="to-options"></div>
                    </div>
                </div>
                
                <button type="submit" class="convert-btn">
                    Convert
                </button>
            </form>
            <p id="result-message" class="hidden"></p>
            <p id="error-message" class="hidden">An error occurred, please try again later</p>
        </div>

        <script src="./currencyConverter.js"></script>
    </body>
</html>
